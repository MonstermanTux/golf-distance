<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf Distance">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Golf Distance</title>
<style>
body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #fff; color: #000; max-width: 520px; margin: 0 auto; }
h1 { font-size: 22px; }
#distance { width: 100%; font-size: 72px; text-align: center; border: 3px solid #000; border-radius: 12px; padding: 10px; box-sizing: border-box; }
button { min-height: 48px; font-size: 20px; margin: 4px; }
button.active { background: #000; color: #fff; }
#close-kb { background: #eee; color: #000; font-size: 16px; min-height: 40px; }
.card { border: 2px solid #000; border-radius: 12px; padding: 10px; margin: 6px 0; }
.card.over { border-color: #c00; background: #fff0f0; color: #c00; }
.card.over .club, .card.over .delta { color: #c00; }
.club { font-size: 36px; font-weight: 900; }
.club.x, .pos.x { font-style: italic; }
.xtag { font-size: 16px; font-weight: 700; color: #0a7a3e; margin-left: 6px; font-style: normal; }
.delta { font-size: 14px; color: #555; }
.mode-label { font-weight: bold; margin-bottom: 4px; font-size: 16px; }
.hint { font-size: 13px; color: #555; margin-top: 8px; }
</style>
</head>
<body>
<h1>Golf Distance</h1>
<input id="distance" type="number" placeholder="metres" inputmode="numeric">
<div>
<button id="btn-carry" onclick="setMode('carry')">Carry</button>
<button id="btn-total" onclick="setMode('total')">Total</button>
<button id="close-kb" onclick="closeKeyboard()">Close Keyboard</button>
</div>
<div id="results"></div>
<p class="hint">~ = modelled fill/scale. Offline after first open.</p>
<script>
const SHOTS = [{"band_m": "230-239", "total_m": 230, "carry_m": 180, "roll_m": 50, "club": "Driver", "hand_position": "9 Deltoid", "source": "measured", "flag": "", "model_total_m": 230}];
window.GOLF_META = {"generated": "2026-11-09T23:32:19.037316+00:00", "source": "distance-by-total-extrapolated.csv", "count": 132, "cache_version": "20261109233219"};
let mode = 'total';
function setMode(m) {
  mode = m;
  document.getElementById('btn-carry').classList.toggle('active', m === 'carry');
  document.getElementById('btn-total').classList.toggle('active', m === 'total');
  render();
}
function closeKeyboard() {
  document.getElementById('distance').blur();
  if (document.activeElement) document.activeElement.blur();
}
function render() {
  const t = parseInt(document.getElementById('distance').value) || 0;
  if (!t) { document.getElementById('results').innerHTML = ''; return; }
  const key = mode === 'carry' ? 'carry_m' : 'total_m';
  const scored = SHOTS
    .filter(s => s[key] !== null && s[key] !== undefined)
    .map(s => ({...s, diff: Math.abs(s[key] - t)}))
    .sort((a, b) => a.diff - b.diff || a[key] - b[key] || String(a.club).localeCompare(String(b.club)));
  const toShow = scored.slice(0, 4);
  const modeName = mode === 'carry' ? 'Carry' : 'Total';
  const html = `<div class="mode-label">Top 4 nearest for ${modeName} ${t}m:</div>` + toShow.map(s => {
    const over = s.diff > 5;
    const isX = s.source === 'extrapolated' || s.source === 'corrected';
    const clubCls = isX ? 'club x' : 'club';
    const posCls = isX ? 'pos x' : 'pos';
    const tag = isX ? '<span class="xtag">~</span>' : '';
    const carry = s.carry_m === null || s.carry_m === undefined ? '—' : s.carry_m;
    const total = s.total_m === null || s.total_m === undefined ? '—' : s.total_m;
    return `<div class="card${over ? ' over' : ''}"><div class="${clubCls}">${s.club}${tag}</div><div class="${posCls}">${s.hand_position}</div><div>C ${carry} · T ${total}</div><div class="delta">${s.diff === 0 ? 'exact' : s.diff + 'm away'}${over ? ' (outside 5m)' : ''}</div></div>`;
  }).join('');
  document.getElementById('results').innerHTML = html;
}
document.getElementById('distance').oninput = render;
document.getElementById('distance').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') closeKeyboard();
});
setMode('total');
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
