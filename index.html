.delta { font-size: 14px; color: #555; }
.mode-label { font-weight: bold; margin-bottom: 4px; font-size: 16px; }
.hint { font-size: 13px; color: #555; margin-top: 8px; }

let mode = 'total';
function setMode(m) {
  mode = m;
  document.getElementById('btn-carry').classList.toggle('active', m === 'carry');
  document.getElementById('btn-total').classList.toggle('active', m === 'total');
  render();
}
function closeKeyboard() {
  document.getElementById('distance').blur();
  if (document.activeElement) document.activeElement.blur();
}
function render() {
  const t = parseInt(document.getElementById('distance').value) || 0;
  if (!t) { document.getElementById('results').innerHTML = ''; return; }
  const key = mode === 'carry' ? 'carry_m' : 'total_m';
  const scored = SHOTS
    .filter(s => s[key] !== null && s[key] !== undefined)
    .map(s => ({...s, diff: Math.abs(s[key] - t)}))
    .sort((a, b) => a.diff - b.diff || a[key] - b[key] || String(a.club).localeCompare(String(b.club)));
  const toShow = scored.slice(0, 4);
  const modeName = mode === 'carry' ? 'Carry' : 'Total';
  const html = `<div class="mode-label">Top 4 nearest for ${modeName} ${t}m:</div>` + toShow.map(s => {
    const over = s.diff > 5;
    const isX = s.source === 'extrapolated' || s.source === 'corrected';
    const clubCls = isX ? 'club x' : 'club';
    const posCls = isX ? 'pos x' : 'pos';
    const tag = isX ? '<span class="xtag">~</span>' : '';
    const carry = s.carry_m === null || s.carry_m === undefined ? '—' : s.carry_m;
    const total = s.total_m === null || s.total_m === undefined ? '—' : s.total_m;
    return `<div class="card${over ? ' over' : ''}"><div class="${clubCls}">${s.club}${tag}</div><div class="${posCls}">${s.hand_position}</div><div>C ${carry} · T ${total}</div><div class="delta">${s.diff === 0 ? 'exact' : s.diff + 'm away'}${over ? ' (outside 5m)' : ''}</div></div>`;
  }).join('');
  document.getElementById('results').innerHTML = html;
}
document.getElementById('distance').oninput = render;
document.getElementById('distance').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') closeKeyboard();
});
setMode('total');
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
